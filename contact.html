<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | Rose Paradise</title>

  <!-- Bootstrap & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="shop.css">

  <style>
    /* 🌸 CONTACT PAGE CLASSES ONLY */
    .contactus-section {
      background-color: #ffe6ef;
      padding: 60px 20px;
      border-bottom: 3px solid #ffd1dc;
      text-align: center;
    }

    .contactus-section h1 {
      font-family: "Great Vibes", cursive;
      color: #e75480;
      font-size: 3rem;
    }

    .contactus-section p {
      color: #b36e6e;
      font-family: "Great Vibes", cursive;
      font-size: 22px;
    }

    .contactus-container {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 15px;
    }

    .contactus-map {
      width: 100%;
      height: 400px;
      border: 3px solid #ffd1dc;
      border-radius: 20px;
      margin-bottom: 40px;
    }

    .contactus-info {
      text-align: center;
      margin-bottom: 40px;
    }

    .contactus-info p {
      font-size: 1.1rem;
      color: #6b4b52;
      margin-bottom: 10px;
    }

    .contactus-email a {
      color: #e75480;
      text-decoration: none;
      font-weight: 600;
    }

    .contactus-email a:hover {
      text-decoration: underline;
    }

    /* 🌸 DETAILED FORM */
    .contactus-form {
      background: white;
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      margin-bottom: 50px;
    }

    .contactus-form h2 {
      font-family: "Great Vibes", cursive;
      color: #e75480;
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 30px;
    }

    .contactus-form label {
      color: #e75480;
      font-weight: 600;
    }

    .contactus-form input,
    .contactus-form textarea {
      border-radius: 12px;
      border: 1px solid #ffd1dc;
      padding: 12px 15px;
      width: 100%;
      margin-bottom: 20px;
      font-size: 1rem;
      color: #6b4b52;
    }

    .contactus-btn {
      background-color: #e75480;
      color: white;
      border-radius: 50px;
      padding: 14px 35px;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      border: none;
      display: block;
      margin: 0 auto;
    }

    .contactus-btn:hover {
      background-color: #c7446a;
      transform: scale(1.05);
    }

    .contactus-footer {
      background-color: #fff;
      color: #e75480;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      border-top: 2px solid #ffd1dc;
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <!-- 🌷 CONTACT HEADER -->
  <section class="contactus-section">
    <h1>Contact Us</h1>
    <p>We would love to hear from you! Reach out for any inquiries or orders 🌸</p>
  </section>

  <div class="contactus-container">

    <!-- 🌍 MAP & ADDRESS -->
    <div class="contactus-info">
      <p><strong>Our Address:</strong> 123 Rose Street, Lahore, Pakistan</p>
      <p class="contactus-email">
        <strong>Email:</strong> <a href="mailto:info@roseparadise.com">info@roseparadise.com</a>
      </p>
    </div>

    <iframe 
      class="contactus-map"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3620.0241379510487!2d67.06318121476305!3d24.90560088405513!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33f6c9c2b9b1d%3A0x507af5cbb5674f97!2sLahore%2C%20Pakistan!5e0!3m2!1sen!2s!4v1697123456789!5m2!1sen!2s" 
      style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <!-- ✉️ DETAILED CONTACT FORM -->
    <form class="contactus-form">
      <h2>Send Us a Message</h2>

      <input type="text" id="contactus-name" placeholder="Your Full Name" required>

      <input type="email" id="contactus-email" placeholder="Your Email Address" required>

      <input type="tel" id="contactus-phone" placeholder="Your Phone Number" required>

      <input type="text" id="contactus-subject" placeholder="Subject" required>

      <textarea id="contactus-message" rows="6" placeholder="Write your message here" required></textarea>

      <button type="submit" class="contactus-btn">Send Message</button>
    </form>

  </div>

  <!-- 🌹 FOOTER -->
  <footer class="contactus-footer">
    <p>© 2025 Rose Paradise | All rights reserved 🌹</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
