<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - Blooming Petals</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Style -->
  <style>
    /* Page Title */
    .contactus-header {
      text-align: center;
      margin-top: 50px;
      margin-bottom: 30px;
    }

    /* Main container */
    .contactus-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      padding: 40px 20px;
    }

    /* Left: Contact Info */
    .contactus-info {
      flex: 1 1 300px;
      max-width: 400px;
    }

    .contactus-info h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .contactus-detail {
      margin-bottom: 15px;
    }

    .contactus-detail strong {
      display: inline-block;
      width: 100px;
    }

    .contactus-mail a {
      color: #d63384;
      text-decoration: none;
      font-weight: bold;
    }

    .contactus-mail a:hover {
      text-decoration: underline;
    }

    /* Right: Google Map */
    .contactus-map {
      flex: 1 1 400px;
      height: 350px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 768px) {
      .contactus-container {
        flex-direction: column;
        align-items: center;
      }

      .contactus-map {
        width: 100%;
        max-width: 500px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 class="contactus-header">Contact Us</h1>

    <div class="contactus-container">
      <!-- Left side - Contact Info -->
      <div class="contactus-info">
        <h2>Blooming Petals</h2>
        <div class="contactus-detail">
          <strong>Address:</strong> 123 Floral Avenue, Garden Town, Lahore, Pakistan
        </div>
        <div class="contactus-detail">
          <strong>Phone:</strong> +92 300 1234567
        </div>
        <div class="contactus-mail contactus-detail">
          <strong>Email:</strong>
          <a href="mailto:info@bloomingpetals.com">info@bloomingpetals.com</a>
        </div>
        <p>We’d love to hear from you! Reach out for custom décor, event planning, or floral styling inquiries.</p>
      </div>

      <!-- Right side - Google Map -->
      <div class="contactus-map">
        <iframe 
          src="https://www.google.com/maps?q=Garden%20Town%20Lahore%20Pakistan&output=embed" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
