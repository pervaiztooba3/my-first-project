<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wedding Decor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="rose.css">


</head>

<body>
  <section class="decor-full-body">
    <section class="decor-section" data-aos="fade-up">
      <h1>Wedding Blooms</h1>
      <p>Making Your ‘Forever’ Begin Amidst Petals of Perfection.</p>
    </section>

    <!-- CARDS WILL RENDER INTO THIS CONTAINER -->
    <section class="container py-5">
      <div id="decor-container" class="row g-4">
        <!-- JS inserts cards here -->
      </div>
    </section>
  
  </section>

  <!-- Compare bar -->
  <div id="compare-bar" aria-hidden="false">
    <div>Selected: <span id="compare-count">0</span></div>
    <button id="open-compare" class="compare-open-btn">Compare</button>
  </div>

  <!-- Compare modal -->
  <div id="compare-modal" class="compare-modal" style="display:none;">
    <div class="compare-content">
      <span id="close-compare" class="close-btn" title="Close">&times;</span>
      <h3>Compare Selected Decors</h3>
      <div id="compare-grid" class="compare-grid"></div>

      <div style="margin-top:18px;">
        <button id="remove-selected" class="decor-btn" style="margin-right:10px;">Remove Selected</button>
        <button id="clear-all" class="decor-btn" style="background:#f2c6d9; color:#7a2a40;">Clear All</button>
      </div>
    </div>
  </div>






  <!-- LIBRARIES -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="flowers.js"></script>

  <script>
    AOS.init({ duration: 1000, once: true });
  </script>
</body>
</html>
