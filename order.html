<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Your Flowers</title>

  <!-- Bootstrap & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- Your shared stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!--  ORDER HEADER SECTION -->
  <section class="order-section">
    <h1>Place Your Order</h1>
    <p class="text-muted">Fill out the form below to order your favorite flower arrangement 🌸</p>
  </section>

  <!--  ORDER FORM SECTION -->
  <section class="order-container">
    <form class="order-form">
      <div class="mb-3">
        <label for="productName" class="form-label">Product Name</label>
        <input type="text" id="productName" class="form-control" placeholder="Enter the product name (e.g. Blush Bouquet)" required>
      </div>

      <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" id="quantity" class="form-control" placeholder="Enter quantity" min="1" required>
      </div>

      <div class="mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="03xx-xxxxxxx" required>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Delivery Address</label>
        <textarea id="address" class="form-control" rows="3" placeholder="Enter your complete address" required></textarea>
      </div>

      <div class="mb-3">
        <label for="payment" class="form-label">Payment Method</label>
        <select id="payment" class="form-select" required>
          <option value="">Select Payment Option</option>
          <option>Cash on Delivery</option>
          <option>Bank Transfer</option>
          <option>EasyPaisa / JazzCash</option>
        </select>
      </div>

      <div class="text-center">
        <button type="submit" class="order-btn">Confirm Order</button>
      </div>
    </form>
  </section>

  <!-- 🌹 FOOTER -->
  <footer class="order-footer">
    <p>© 2025 Rose Paradise | All rights reserved 🌹</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
